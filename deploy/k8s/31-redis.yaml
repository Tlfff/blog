# Redis：headless Service，给应用提供稳定的 DNS 名字 redis:6379
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: lf-blog
spec:
  clusterIP: None # headless 模式，应用通过名字 redis 访问
  selector:
    app: redis # 选中标签为 app=redis 的 Pod
  ports:
    - name: redis
      port: 6379 # Service 对外端口，应用连接的就是这个
      targetPort: redis # 转发到 Pod 上名为 redis 的容器端口
---
# Redis 单副本 StatefulSet，开启 AOF 混合持久化（等价 compose 的 redis-server --appendonly yes ...）
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: lf-blog
spec:
  serviceName: redis # 关联上面的 headless Service
  replicas: 1 # 单副本
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis # Pod 标签，Service 通过它找到本 Pod
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-node1 # 只调度到 k8s-node1（hostPath 数据卷只在该节点）
      imagePullSecrets:
        - name: tencent-ccr # 私有仓库拉取凭据
      containers:
        - name: redis
          image: ccr.ccs.tencentyun.com/lf-blog/redis:7-alpine # 同步到腾讯云仓库的 Redis 镜像
          imagePullPolicy: IfNotPresent # 本地已有镜像就不重复拉取
          args: # 等价于 compose 的 command
            - redis-server
            - --appendonly # 开启 AOF 持久化，重启后数据不丢
            - "yes"
            - --aof-use-rdb-preamble # AOF 文件头部先用 RDB 格式，恢复更快、文件更小
            - "yes"
          ports:
            - name: redis # 给容器端口起名，Service 的 targetPort 引用它
              containerPort: 6379
          startupProbe: # 启动探针：等 Redis 真正能响应再继续
            exec:
              command:
                - redis-cli
                - ping # Redis 自带命令，返回 PONG 说明正常
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12 # 连续失败 12 次（约 1 分钟）才判定启动失败
          readinessProbe: # 就绪探针：通过后 Service 才转发流量
            exec:
              command:
                - redis-cli
                - ping
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe: # 存活探针：连续失败会重启容器
            exec:
              command:
                - redis-cli
                - ping
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources: # 资源配额
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data # Redis 数据目录，挂到 PVC 实现持久化
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: redis-data # 绑定 20-storage.yaml 定义的 PVC
