# MongoDB：headless Service，给应用提供稳定的 DNS 名字 mongodb:27017
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: lf-blog
spec:
  clusterIP: None # headless 模式
  selector:
    app: mongodb # 选中标签为 app=mongodb 的 Pod
  ports:
    - name: mongodb
      port: 27017 # Service 对外端口
      targetPort: mongodb # 转发到 Pod 上名为 mongodb 的容器端口
---
# MongoDB 单副本 StatefulSet
# 环境变量会创建 root 用户（认证库为 admin），应用连接时带 ?authSource=admin
# 启动时会执行 /docker-entrypoint-initdb.d 下的 notification.js 创建集合和索引（仅数据目录为空时）
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: lf-blog
spec:
  serviceName: mongodb # 关联上面的 headless Service
  replicas: 1 # 单副本
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb # Pod 标签
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-node1 # 只调度到 k8s-node1
      imagePullSecrets:
        - name: tencent-ccr # 私有仓库拉取凭据
      containers:
        - name: mongodb
          image: ccr.ccs.tencentyun.com/lf-blog/mongo:7 # 同步到腾讯云仓库的 MongoDB 镜像
          imagePullPolicy: IfNotPresent
          env:
            # 敏感信息从 Secret 读取
            - name: MONGO_INITDB_ROOT_USERNAME # 初始化 MongoDB 的 root 用户名
              valueFrom:
                secretKeyRef:
                  name: infra-secrets
                  key: mongodb-root-username
            - name: MONGO_INITDB_ROOT_PASSWORD # 初始化 MongoDB 的 root 密码
              valueFrom:
                secretKeyRef:
                  name: infra-secrets
                  key: mongodb-root-password
            - name: MONGO_INITDB_DATABASE # 初始化时创建的数据库名
              valueFrom:
                secretKeyRef:
                  name: infra-secrets
                  key: mongodb-database
            - name: TZ # 容器时区
              value: Asia/Shanghai
          ports:
            - name: mongodb
              containerPort: 27017
          startupProbe: # 启动探针：等 MongoDB 能认证通过再继续
            exec:
              command:
                - sh
                - -ec
                # 用 root 账号向 admin 库发 ping，返回 1 才算成功；必须带认证库，否则 AuthenticationFailed
                - mongosh --quiet --host 127.0.0.1 --username "$MONGO_INITDB_ROOT_USERNAME" --password "$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --eval "db.adminCommand('ping').ok" | grep 1
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 18 # 首次启动初始化较慢，给足 3 分钟
          readinessProbe: # 就绪探针
            exec:
              command:
                - sh
                - -ec
                - mongosh --quiet --host 127.0.0.1 --username "$MONGO_INITDB_ROOT_USERNAME" --password "$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --eval "db.adminCommand('ping').ok" | grep 1
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe: # 存活探针
            exec:
              command:
                - sh
                - -ec
                - mongosh --quiet --host 127.0.0.1 --username "$MONGO_INITDB_ROOT_USERNAME" --password "$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --eval "db.adminCommand('ping').ok" | grep 1
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources: # 资源配额
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /data/db # MongoDB 数据目录，挂到 PVC 持久化
            - name: init
              mountPath: /docker-entrypoint-initdb.d # 初始化脚本目录
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mongodb-data # 绑定 20-storage.yaml 定义的 PVC
        - name: init
          configMap:
            name: database-init # 初始化 JS 来自 ConfigMap
            items:
              - key: notification.js
                path: notification.js
