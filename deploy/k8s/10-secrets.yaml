# 本文件是 Secret 模板，不包含真实凭证。
# 部署前先加载 .env，再执行：set -a && source .env && set +a && envsubst < deploy/k8s/10-secrets.yaml | kubectl apply -f -
# 基础组件（MySQL/MongoDB）的账号密码
# type: Opaque 表示通用机密数据（非 TLS 证书等特殊类型）
# 值 base64 存储，kubectl get 时看到的是编码后的字符串
apiVersion: v1
kind: Secret
metadata:
  name: infra-secrets
  namespace: lf-blog
type: Opaque
stringData:
  # stringData 写法：明文写值，Kubernetes 自动帮你 base64 编码
  mysql-root-password: "${MYSQL_ROOT_PASSWORD}"   # MySQL root 超级管理员密码
  mysql-database: "${MYSQL_DATABASE}"           # 自动创建的数据库名
  mysql-username: "${MYSQL_USER}"       # 应用专用用户（不用 root 连库）
  mysql-password: "${MYSQL_PASSWORD}"       # 应用用户的密码
  mongodb-root-username: "${MONGODB_ROOT_USERNAME}" # MongoDB root 用户名（建在 admin 认证库）
  mongodb-root-password: "${MONGODB_ROOT_PASSWORD}" # MongoDB root 密码
  mongodb-database: "${MONGODB_DATABASE}"          # MongoDB 数据库名
---
# 应用完整配置（等价 config.docker.yaml），挂载到 /app/config/config.yaml
# 三个服务（server/grpc/kafka-consume）共用这一份配置
apiVersion: v1
kind: Secret
metadata:
  name: blog-config
  namespace: lf-blog
type: Opaque
stringData:
  # 注意：下面整个块是 YAML 字符串（| 表示保留换行的多行文本），
  # 挂载后就是应用读取的 config.yaml 文件本身
  config.yaml: |
    database:          # MySQL 连接配置
      username: "${MYSQL_USER}"  # 用户名
      password: "${MYSQL_PASSWORD}"  # 密码
      host: "mysql"         # 主机名：DNS 解析到 mysql Service
      port: 3306            # 端口
      dbname: "${MYSQL_DATABASE}"        # 数据库名
    redis:             # Redis 连接配置
      addr: "redis:6379"    # 地址：redis Service 的 6379
      db: 0                 # 使用的逻辑库编号（0-15）
      password: "${REDIS_PASSWORD}"          # Redis 密码，未启用时为空
    mongodb:           # MongoDB 连接配置
      host: "mongodb"       # 主机名：解析到 mongodb Service
      port: 27017           # 端口
      dbname: "${MONGODB_DATABASE}"        # 数据库名
      username: "${MONGODB_ROOT_USERNAME}"      # root 用户名
      password: "${MONGODB_ROOT_PASSWORD}"      # root 密码
    jwt:               # C 端用户 JWT 签名密钥
      secret: "${JWT_SECRET}"  # JWT签名密钥
    openjwt:           # 二方服务专用 JWT 密钥（与 C 端完全隔离）
      secret: "${OPENJWT_SECRET}"  # 二方服务专用JWT密钥
    grpc:              # gRPC 服务监听端口
      port: "9100"  # 二方gRPC服务监听端口
    thirdparty:        # 三方合作方密钥列表
      - partner_id: "partner-a"        # 合作方组织标识（仅统计用）
        access_key_id: "${PARTNER_A_ACCESS_KEY_ID}"  # 凭证身份，请求头 x-access-key-id 携带
        secret_key: "${PARTNER_A_SECRET_KEY}"  # 共享密钥，仅合作方和服务端知道
    oss:               # MinIO 对象存储配置（头像直传）
      endpoint: "muzimi.xyz:9000"      # MinIO 服务地址
      access_key_id: "${OSS_ACCESS_KEY_ID}"          # AK
      secret_access_key: "${OSS_SECRET_ACCESS_KEY}"  # SK
      bucket: "blog-images"            # 存储桶名
      use_ssl: true                    # 是否使用 HTTPS
      public_domain: "https://muzimi.xyz:9000/blog-images"  # 头像公网访问地址前缀
      allowed_exts: ["jpg", "jpeg", "png", "webp"]  # 允许上传的文件扩展名
    kafka:             # Kafka 连接配置
      brokers: "kafka:9092"  # broker 地址列表（kafka Service）
      
      dead_letter:  # 死信队列
        topic: "dead_letter"             # 统一的死信队列 topic 名称
        max_retries: 3                   # 发送到死信队列的重试次数
        consumer_group: "blog_dead_letter_consumer"  # 死信队列消费者组
      topics:
        notification:
          name: "notification"
          group_id: "blog_notification_consumer"
          start_offset: "oldest"
          batch_size: 50          # 批量消费条数，消费者拉取用的条数
          batch_timeout_ms: 10000  # 批量超时时间（毫秒）
          fetch_timeout_ms: 3000  # 拉取单条消息的超时时间（毫秒）
          max_retries: 3                      # 消息处理最大重试次数
          retry_wait_ms: 100         # 重试间隔（毫秒）

        view_history:
          name: "view_history"
          group_id: "blog_view_consumer"
          start_offset: "oldest"
          batch_size: 100         # 批量消费条数，消费者拉取用的条数
          batch_timeout_ms: 10000   # 批量超时时间（毫秒）
          fetch_timeout_ms: 3000  # 拉取单条消息的超时时间（毫秒）
          max_retries: 3                      # 消息处理最大重试次数
          retry_wait_ms: 100         # 重试间隔（毫秒）
        

      producer:
        acks: "one"
        batch_size: 10  # 10条消息则发送
        batch_size_bytes: 16384  # 消息总字节数达到16KB时也发送
        batch_timeout_ms: 200  # 200ms，如果200ms内没有凑齐batch_size，则强制发送
        max_retries: 3  # 最大重试次数，默认 3 次
        compression_type: "snappy"
      consumer:
        group_balancer: "range" # 消费者组分区分配策略
        max_bytes: 1048576 # 消费者一次最多拉取多少字节，默认 1MB
        min_bytes: 1  # 消费者拉取消息时，至少获取多少字节才返回，默认 1 字节
        max_wait_ms: 500  # 最大等待时间，默认 500ms
        session_timeout_ms: 30000  # 会话超时时间，默认 30s
        commit_retries: 3  # 提交偏移量重试次数，默认 3 次
        commit_wait_ms: 100  # 提交偏移量间隔，默认 100 毫秒

---
# 应用运行环境变量模板，供 server/grpc/kafka-consume Pod 展开 config.yaml 中的占位符
apiVersion: v1
kind: Secret
metadata:
  name: blog-app-env
  namespace: lf-blog
type: Opaque
stringData:
  MYSQL_USER: "${MYSQL_USER}"
  MYSQL_PASSWORD: "${MYSQL_PASSWORD}"
  MYSQL_DATABASE: "${MYSQL_DATABASE}"
  REDIS_PASSWORD: "${REDIS_PASSWORD}"
  MONGODB_ROOT_USERNAME: "${MONGODB_ROOT_USERNAME}"
  MONGODB_ROOT_PASSWORD: "${MONGODB_ROOT_PASSWORD}"
  MONGODB_DATABASE: "${MONGODB_DATABASE}"
  JWT_SECRET: "${JWT_SECRET}"
  OPENJWT_SECRET: "${OPENJWT_SECRET}"
  PARTNER_A_ACCESS_KEY_ID: "${PARTNER_A_ACCESS_KEY_ID}"
  PARTNER_A_SECRET_KEY: "${PARTNER_A_SECRET_KEY}"
  OSS_ACCESS_KEY_ID: "${OSS_ACCESS_KEY_ID}"
  OSS_SECRET_ACCESS_KEY: "${OSS_SECRET_ACCESS_KEY}"
