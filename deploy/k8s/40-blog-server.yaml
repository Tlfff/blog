# ------------------------------ 集群内部访问（ClusterIP） ------------------------------
# blog-server 集群内 Service（ClusterIP）：Pod 之间通过 blog-server:8080 访问
apiVersion: v1
kind: Service
metadata:
  name: blog-server      # Service 名称，其他 Pod 通过它访问
  namespace: lf-blog     # Service 所在命名空间
spec:
  type: ClusterIP   # 默认类型：只在集群内部可达
  selector:
    app: blog-server # 流量转发给带有 app=blog-server 标签的 Pod
  ports:
    - name: http
      port: 8080 # Service 在集群内暴露的端口
      targetPort: http # 转发到 Pod 上名为 http 的容器端口
---
# ------------------------------ 对外访问（NodePort） ------------------------------
# blog-server 对外 NodePort：把 8080 暴露到宿主机端口 30080
apiVersion: v1
kind: Service
metadata:
  name: blog-server-nodeport
  namespace: lf-blog
spec:
  type: NodePort # 在每个节点上开一个固定端口转发进来
  selector:
    app: blog-server
  ports:
    - name: http
      port: 8080 # 集群内访问端口
      targetPort: http
      nodePort: 30080 # 宿主机端口（30000-32767 范围内自定义）
---

# ------------------------------ 应用部署（Deployment） ------------------------------
# 博客 HTTP 服务（Gin）：启动命令 server，监听 8080
# 配置通过 Secret 挂载到 /app/config/config.yaml（等价 compose 里覆盖配置文件）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blog-server      # Deployment 名称，其他资源引用它时用
  namespace: lf-blog     # Deployment 所在命名空间  
spec:
  strategy:
    type: RollingUpdate # 滚动更新策略，逐步替换旧副本，确保服务不中断
    rollingUpdate:
      maxUnavailable: 0        # 更新时最多允许 0 个旧副本不可用
      maxSurge: 1              # 更新时最多允许 1 个新副本
  replicas: 1 # 副本数
  selector:
    matchLabels:
      app: blog-server
  template:
    metadata:
      labels:
        app: blog-server # Pod 标签，Service 通过它路由
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-node1 # 只调度到 k8s-node1 节点，加上别的节点后可以删除
      imagePullSecrets:
        - name: tencent-ccr # 私有仓库拉取凭据
      containers:
        - name: blog-server
          image: ccr.ccs.tencentyun.com/lf-blog/blog-web:v1.0.0 # 博客应用镜像
          imagePullPolicy: IfNotPresent
          args:
            - server # 指定以 HTTP 服务模式启动（镜像 ENTRYPOINT 是 ./blog）
          ports:
            - name: http # 给容器端口起名，Service 的 targetPort 引用它
              containerPort: 8080
          startupProbe: # 启动探针：应用启动慢（要连 MySQL 等），给足 2 分钟宽限
            tcpSocket:
              port: http # 检查 8080 端口能否建立 TCP 连接
            periodSeconds: 5  # 每 5 秒检查一次
            timeoutSeconds: 2  # 超时时间，2 秒内没响应算失败
            failureThreshold: 24 # 24 次 × 5 秒 = 约 2 分钟
          readinessProbe: # 就绪探针：通过后 Service 才转发流量，避免访问到没起好的实例
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe: # 存活探针：端口不通说明进程挂了，K8s 自动重启
            tcpSocket:
              port: http
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          resources: # 资源配额
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /app/config/config.yaml # 应用固定从这个路径读配置
              subPath: config.yaml # 只挂 Secret 里的 config.yaml 这一个 key（否则会覆盖整个目录）
              readOnly: true
      volumes:  # 声明要使用的数据卷
        - name: config
          secret:
            secretName: blog-config # 配置来自 Secret
            items:
              - key: config.yaml
                path: config.yaml
