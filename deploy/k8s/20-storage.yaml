# Elasticsearch 数据卷：搜索索引可重建，但仍持久化以缩短重启恢复时间
apiVersion: v1
kind: PersistentVolume
metadata:
  name: lf-blog-elasticsearch-pv
spec:
  capacity:
    storage: 10Gi
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: /var/lib/lf-blog/elasticsearch
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: elasticsearch-data
  namespace: lf-blog
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: manual
  volumeName: lf-blog-elasticsearch-pv
  resources:
    requests:
      storage: 10Gi
