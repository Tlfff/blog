// user.proto：Identity 领域用户服务的对外开放接口定义（供内部聚合与三方合作方调用）。
syntax = "proto3"; // 使用 proto3 语法

package blogopen.v1; // 对外开放接口的包名，v1 为契约版本

option go_package = "blog/gen/user;user"; // blog/gen/user 为 Go 导入路径，user 为 Go 包名

// 用户服务定义：提供不同脱敏级别的用户信息查询能力。
service UserService {
  // 获取用户基本信息（ID、昵称、头像、最后登录时间与IP），仅供内部可信调用方使用
  rpc GetUserBasicInfo (GetUserBasicInfoRequest) returns (GetUserBasicInfoResponse);
  // 获取用户公开信息（ID、昵称、头像），提供给三方合作方，不含登录痕迹
  rpc GetPublicUserInfo (GetUserInfoRequest) returns (GetUserInfoResponse);
}

// 请求：获取单个用户基本信息
message GetUserBasicInfoRequest {
  uint64 user_id = 1; // 用户ID
}

// 响应：用户基本信息（含登录痕迹，禁止直接透传给三方）
message GetUserBasicInfoResponse {
  uint64 user_id = 1;        // 用户ID
  string nickname = 2;       // 用户昵称
  string avatar = 3;         // 用户头像URL
  int64 last_login_time = 4; // 最后登录时间，Unix 时间戳（秒）
  string last_login_ip = 5;  // 最后登录IP
}

// 请求：获取用户公开信息（三方合作方使用）
message GetUserInfoRequest {
  uint64 user_id = 1; // 用户ID
}

// 响应：用户公开信息（仅对外暴露 ID、头像、昵称）
message GetUserInfoResponse {
  uint64 id = 1;       // 用户ID
  string avatar = 2;   // 用户头像URL
  string nickname = 3; // 用户昵称
}
