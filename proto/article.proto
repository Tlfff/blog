syntax = "proto3";

package blogopen.v1;

option go_package = "blog/gen/article;article";

// 文章服务定义
service ArticleService {
  // 获取全部可用文章列表 (除已删除)
  rpc GetPublishedList (GetExternalListRequest) returns (ExternalListResponse);
}

// 请求：获取文章列表
message GetExternalListRequest {
  uint64 page = 1;
  uint64 page_size = 2;
  bool is_desc = 3;     // 是否按创建时间降序
}

// 响应：文章列表
message ExternalListResponse {
  repeated ArticleItem items = 1;
  uint64 total = 2; // 总文章数
  uint64 page = 3; // 当前页码
  uint64 page_size = 4; // 每页数量
}

message ArticleItem {
  uint64 id = 1; // 文章ID
  string title = 2; // 标题
  repeated string tags = 3; // 标签
  int64 created_time = 4; // 创建时间
  int64 updated_time = 5; // 更新时间
}