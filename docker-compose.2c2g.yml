# 腾讯云 2 核 2 GB 轻量服务器的实验性资源覆盖配置。
# 使用方式：docker compose -f docker-compose.prod.yml -f docker-compose.2c2g.yml up -d
# 该配置依赖宿主机至少启用 4 GB Swap，仅适合低流量验证环境。
services:
  mysql:
    mem_limit: 384m
    mem_reservation: 256m
    memswap_limit: 512m
    cpus: 0.60
    command:
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_unicode_ci"
      - "--server-id=1"
      - "--log-bin=mysql-bin"
      - "--binlog-format=ROW"
      - "--binlog-row-image=FULL"
      - "--binlog-expire-logs-seconds=604800"
      - "--innodb-buffer-pool-size=128M"
      - "--innodb-log-buffer-size=16M"
      - "--max-connections=50"
      - "--table-open-cache=400"
      - "--tmp-table-size=16M"
      - "--max-heap-table-size=16M"

  redis:
    mem_limit: 96m
    mem_reservation: 48m
    memswap_limit: 128m
    cpus: 0.20
    command:
      - "redis-server"
      - "--appendonly"
      - "yes"
      - "--aof-use-rdb-preamble"
      - "yes"
      - "--maxmemory"
      - "64mb"
      - "--maxmemory-policy"
      - "noeviction"

  mongodb:
    mem_limit: 384m
    mem_reservation: 256m
    memswap_limit: 512m
    cpus: 0.35
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.25"]

  kafka:
    mem_limit: 384m
    mem_reservation: 256m
    memswap_limit: 512m
    cpus: 0.45
    environment:
      KAFKA_HEAP_OPTS: "-Xms128m -Xmx192m"

  elasticsearch:
    mem_limit: 512m
    mem_reservation: 384m
    memswap_limit: 768m
    cpus: 0.60
    environment:
      ES_JAVA_OPTS: "-Xms256m -Xmx256m"

  canal-init:
    mem_limit: 128m
    mem_reservation: 64m
    memswap_limit: 192m
    cpus: 0.20

  canal:
    mem_limit: 320m
    mem_reservation: 192m
    memswap_limit: 448m
    cpus: 0.35
    environment:
      JAVA_OPTS: "-Xms128m -Xmx192m -Xmn64m"

  blog-server:
    mem_limit: 160m
    mem_reservation: 96m
    memswap_limit: 224m
    cpus: 0.45
    environment:
      GOMEMLIMIT: "128MiB"
      GOMAXPROCS: "1"

  blog-grpc:
    mem_limit: 80m
    mem_reservation: 48m
    memswap_limit: 112m
    cpus: 0.20
    environment:
      GOMEMLIMIT: "64MiB"
      GOMAXPROCS: "1"

  blog-consumer:
    mem_limit: 128m
    mem_reservation: 80m
    memswap_limit: 192m
    cpus: 0.35
    environment:
      GOMEMLIMIT: "96MiB"
      GOMAXPROCS: "1"

  search-sync:
    mem_limit: 96m
    mem_reservation: 64m
    memswap_limit: 144m
    cpus: 0.25
    environment:
      GOMEMLIMIT: "72MiB"
      GOMAXPROCS: "1"
