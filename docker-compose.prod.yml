name: blog

# 服务定义
services:
  # MySQL 服务定义
  mysql:
    image: mysql:8.0    # MySQL 镜像版本，8.0 版本
    container_name: blog-mysql # 容器名字
    restart: always # 重启策略，容器异常退出时总是自动重启
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"            # root 超级管理员密码
      MYSQL_DATABASE: "${MYSQL_DATABASE}"                    # 容器启动时自动创建的数据库名
      MYSQL_USER: "${MYSQL_USER}"                    # 额外创建的应用专用用户
      MYSQL_PASSWORD: "${MYSQL_PASSWORD}"                # 应用用户的密码
      TZ: Asia/Shanghai                         # 容器时区设置，影响时间函数
    ports:
      - "3306:3306" # 映射端口，外部访问端口：容器端口
    volumes:
      - mysql_data:/var/lib/mysql # 映射数据卷，将容器内的数据持久化到主机
      - ./scripts/mysql:/docker-entrypoint-initdb.d:ro # 映射初始化脚本，仅数据目录为空时执行一次，自动建库建表
    command:
      - "--character-set-server=utf8mb4"  # 设置字符集为 utf8mb4
      - "--collation-server=utf8mb4_unicode_ci"  # 设置排序规则为 utf8mb4_unicode_ci
      - "--server-id=1"                     # Canal 读取 binlog 所需的唯一服务器 ID
      - "--log-bin=mysql-bin"               # 开启 MySQL binlog
      - "--binlog-format=ROW"                # Canal 需要行级变更事件
      - "--binlog-row-image=FULL"            # 记录完整前后行，便于搜索文档转换
      - "--binlog-expire-logs-seconds=604800" # binlog 保留 7 天
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"] # 健康检查
      interval: 10s # 检查间隔，10 秒
      timeout: 10s   # 检查超时时间，10 秒
      retries: 10      # 最大重试次数，10 次
      start_period: 60s # 等待 60 秒，确保mysql初始化完成
    networks:
      - blog-net # 加入自定义网络 blog-net

  # Redis 服务定义
  redis:
    image: redis:7-alpine
    container_name: blog-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data  # 映射数据卷，将容器内的数据持久化到主机
    command: redis-server --appendonly yes --aof-use-rdb-preamble yes # 开启混合持久化
    healthcheck:
      test: ["CMD", "redis-cli", "ping"] # 检查 Redis 服务是否正常
      interval: 10s # 检查间隔，10 秒
      timeout: 10s   # 检查超时时间，10 秒
      retries: 5       # 最大重试次数，5 次
      start_period: 30s # 容器启动后等待 30 秒，确保redis初始化完成
    networks:
      - blog-net

  # MongoDB 服务定义
  mongodb:
    image: mongo:7
    container_name: blog-mongodb
    restart: always
    environment:  # 环境变量配置
      MONGO_INITDB_ROOT_USERNAME: "${MONGODB_ROOT_USERNAME}" # 初始化 MongoDB 的 root 用户名
      MONGO_INITDB_ROOT_PASSWORD: "${MONGODB_ROOT_PASSWORD}" # 初始化 MongoDB 的 root 密码
      MONGO_INITDB_DATABASE: "${MONGODB_DATABASE}" # 初始化 MongoDB 的数据库名
      TZ: Asia/Shanghai # 容器时区设置，影响时间函数
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db # 映射数据卷，将容器内的数据持久化到主机
      - ./scripts/mongodb:/docker-entrypoint-initdb.d:ro # 映射初始化脚本，仅数据目录为空时执行一次
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"] # 检查 MongoDB 服务是否正常
      interval: 10s # 检查间隔，10 秒
      timeout: 10s   # 检查超时时间，10 秒
      retries: 5       # 最大重试次数，5 次
      start_period: 30s # 容器启动后等待 30 秒，确保mongodb初始化完成
    networks:
      - blog-net

  # Kafka 服务定义
  kafka:
    image: apache/kafka:4.0.0
    container_name: blog-kafka
    restart: always
    environment:
      # KRaft 模式：节点既是 broker 又是 controller
      KAFKA_NODE_ID: "1"  # 节点 ID，用于 KRaft 协议
      KAFKA_PROCESS_ROLES: "broker,controller"  # 节点角色，broker 或 controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"  # 控制器选举投票者列表
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"   # controller 监听器名称
      KAFKA_LISTENERS: "PLAINTEXT://:9092,EXTERNAL://:29092,CONTROLLER://:9093"   # 监听器配置，容器间通信 / 宿主机访问 / controller 内部选举
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,EXTERNAL://43.155.168.116:29092"   # 对外公布的地址，容器间通信 / 宿主机访问
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"  # 监听器安全协议映射，容器间通信 / 宿主机访问 / controller 内部选举，PLAINTEXT 明文
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"  # 自动创建主题，当消费者订阅不存在的主题时，会自动创建该主题
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"  # 消费者进度记录保存几份副本
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"  # 事务状态日志保存几份副本
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"  # 事务状态日志最小 ISR，默认值为 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"  # 消费者启动时，等待多久开始分配任务
      TZ: Asia/Shanghai
    ports:
      - "9092:9092"      # 容器间内部通信
      - "29092:29092"    # 宿主机外部访问（Kafka 工具连接用）
    volumes:
      - kafka_data:/bitnami/kafka   # 映射数据卷，将容器内的数据持久化到主机
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092 || exit 1"]
      interval: 10s # 检查间隔，10 秒
      timeout: 10s   # 检查超时时间，10 秒
      retries: 5       # 最大重试次数，5 次
      start_period: 30s    # 容器启动后等待 30 秒，确保Kafka初始化完成
    networks:
      - blog-net

  # Elasticsearch 搜索引擎，仅通过容器内网络访问
  elasticsearch:
    build:
      context: .
      dockerfile: docker/es/Dockerfile
    image: blog-elasticsearch:8.19.20-ik-pinyin
    container_name: blog-es
    restart: always
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - xpack.security.enrollment.enabled=false
      - ELASTIC_PASSWORD=${ELASTICSEARCH_PASSWORD}
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - TZ=Asia/Shanghai
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -u elastic:$$ELASTIC_PASSWORD http://127.0.0.1:9200/_cluster/health | grep -q status"]
      interval: 10s
      timeout: 10s
      retries: 8
      start_period: 60s
    networks:
      - blog-net

  # Canal 复制账号初始化任务
  canal-init:
    image: mysql:8.0
    container_name: blog-canal-init
    restart: "no"
    env_file:
      - .env
    environment:
      MYSQL_HOST: "mysql"
    entrypoint: ["/bin/bash", "/usr/local/bin/canal_user.sh"]
    volumes:
      - ./scripts/mysql/canal_user.sh:/usr/local/bin/canal_user.sh:ro
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - blog-net

  # Canal binlog 订阅服务，仅通过容器内网络访问
  canal:
    image: canal/canal-server:v1.1.8
    container_name: blog-canal
    restart: unless-stopped
    environment:
      JAVA_OPTS: "-Xms256m -Xmx512m -Xmn128m"
      canal.auto.scan: "false"
      canal.destinations: "article_search"
      canal.instance.master.address: "mysql:3306"
      canal.instance.mysql.slaveId: "1234"
      canal.instance.dbUsername: "${CANAL_DB_USERNAME}"
      canal.instance.dbPassword: "${CANAL_DB_PASSWORD}"
      canal.instance.connectionCharset: "UTF-8"
      canal.instance.gtidon: "false"
      canal.instance.tsdb.enable: "true"
      canal.instance.parser.parallel: "false"
      canal.instance.filter.regex: 'blog\.articles'
    volumes:
      - canal_conf:/home/admin/canal-server/conf
      - canal_logs:/home/admin/canal-server/logs
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 11111 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    depends_on:
      canal-init:
        condition: service_completed_successfully
    networks:
      - blog-net

  # 后端服务（HTTP）
  blog-server:
    env_file:
      - .env
    environment:
      MYSQL_USER: "${MYSQL_USER}"                                      # MySQL 应用账号
      MYSQL_PASSWORD: "${MYSQL_PASSWORD}"                              # MySQL 应用密码
      MYSQL_DATABASE: "${MYSQL_DATABASE}"                              # MySQL 数据库名
      REDIS_PASSWORD: "${REDIS_PASSWORD}"                              # Redis 密码
      MONGODB_ROOT_USERNAME: "${MONGODB_ROOT_USERNAME}"                # MongoDB 账号
      MONGODB_ROOT_PASSWORD: "${MONGODB_ROOT_PASSWORD}"                # MongoDB 密码
      MONGODB_DATABASE: "${MONGODB_DATABASE}"                          # MongoDB 数据库名
      JWT_SECRET: "${JWT_SECRET}"                                      # 用户 JWT 签名密钥
      OPENJWT_SECRET: "${OPENJWT_SECRET}"                              # 开放 gRPC JWT 签名密钥
      PARTNER_A_ACCESS_KEY_ID: "${PARTNER_A_ACCESS_KEY_ID}"            # 三方合作方访问凭证
      PARTNER_A_SECRET_KEY: "${PARTNER_A_SECRET_KEY}"                  # 三方合作方共享密钥
      OSS_ACCESS_KEY_ID: "${OSS_ACCESS_KEY_ID}"                        # OSS 访问凭证
      OSS_SECRET_ACCESS_KEY: "${OSS_SECRET_ACCESS_KEY}"                # OSS 访问密钥
      ELASTICSEARCH_USERNAME: "${ELASTICSEARCH_USERNAME:-elastic}"
      ELASTICSEARCH_PASSWORD: "${ELASTICSEARCH_PASSWORD}"
      CANAL_SERVER_USERNAME: "${CANAL_SERVER_USERNAME:-}"
      CANAL_SERVER_PASSWORD: "${CANAL_SERVER_PASSWORD:-}"
    image: ccr.ccs.tencentyun.com/lf-blog/blog-web:v1.0.0 # 用腾讯云仓库的镜像
    container_name: blog-server
    restart: always
    command: ["server"] # 启动容器内的命令
    ports:
      - "8080:8080"
    volumes:
      - ./config/config.docker.yaml:/app/config/config.yaml:ro  # 用 docker 专用配置覆盖容器内默认的 config.yaml
      - ./internal/platform/ip/resource:/app/internal/platform/ip/resource:ro  # Platform IP 地理位置数据库（只读挂载，方便更新）
    depends_on:   # 依赖的其他服务
      mysql:
        condition: service_healthy    # 等待 MySQL 服务健康
      redis:
        condition: service_healthy    # 等待 Redis 服务健康
      mongodb:
        condition: service_healthy    # 等待 MongoDB 服务健康
      kafka:
        condition: service_healthy    # 等待 Kafka 服务健康
    networks:
      - blog-net

  # 对外服务（gRPC，二方/三方）
  blog-grpc:
    env_file:
      - .env
    environment:
      MYSQL_USER: "${MYSQL_USER}"                                      # MySQL 应用账号
      MYSQL_PASSWORD: "${MYSQL_PASSWORD}"                              # MySQL 应用密码
      MYSQL_DATABASE: "${MYSQL_DATABASE}"                              # MySQL 数据库名
      REDIS_PASSWORD: "${REDIS_PASSWORD}"                              # Redis 密码
      MONGODB_ROOT_USERNAME: "${MONGODB_ROOT_USERNAME}"                # MongoDB 账号
      MONGODB_ROOT_PASSWORD: "${MONGODB_ROOT_PASSWORD}"                # MongoDB 密码
      MONGODB_DATABASE: "${MONGODB_DATABASE}"                          # MongoDB 数据库名
      JWT_SECRET: "${JWT_SECRET}"                                      # 用户 JWT 签名密钥
      OPENJWT_SECRET: "${OPENJWT_SECRET}"                              # 开放 gRPC JWT 签名密钥
      PARTNER_A_ACCESS_KEY_ID: "${PARTNER_A_ACCESS_KEY_ID}"            # 三方合作方访问凭证
      PARTNER_A_SECRET_KEY: "${PARTNER_A_SECRET_KEY}"                  # 三方合作方共享密钥
      OSS_ACCESS_KEY_ID: "${OSS_ACCESS_KEY_ID}"                        # OSS 访问凭证
      OSS_SECRET_ACCESS_KEY: "${OSS_SECRET_ACCESS_KEY}"                # OSS 访问密钥
      ELASTICSEARCH_USERNAME: "${ELASTICSEARCH_USERNAME:-elastic}"
      ELASTICSEARCH_PASSWORD: "${ELASTICSEARCH_PASSWORD}"
      CANAL_SERVER_USERNAME: "${CANAL_SERVER_USERNAME:-}"
      CANAL_SERVER_PASSWORD: "${CANAL_SERVER_PASSWORD:-}"
    image: ccr.ccs.tencentyun.com/lf-blog/blog-web:v1.0.0
    container_name: blog-grpc
    restart: always
    command: ["grpc"] # 启动容器内的命令
    ports:
      - "9100:9100"
    volumes:
      - ./config/config.docker.yaml:/app/config/config.yaml:ro  # 用 docker 专用配置覆盖容器内默认的 config.yaml
    depends_on:   # 依赖的其他服务
      mysql:
        condition: service_healthy    # 等待 MySQL 服务健康
      redis:
        condition: service_healthy    # 等待 Redis 服务健康
    networks:
      - blog-net

  # Kafka 消费者
  blog-consumer:
    env_file:
      - .env
    environment:
      MYSQL_USER: "${MYSQL_USER}"                                      # MySQL 应用账号
      MYSQL_PASSWORD: "${MYSQL_PASSWORD}"                              # MySQL 应用密码
      MYSQL_DATABASE: "${MYSQL_DATABASE}"                              # MySQL 数据库名
      REDIS_PASSWORD: "${REDIS_PASSWORD}"                              # Redis 密码
      MONGODB_ROOT_USERNAME: "${MONGODB_ROOT_USERNAME}"                # MongoDB 账号
      MONGODB_ROOT_PASSWORD: "${MONGODB_ROOT_PASSWORD}"                # MongoDB 密码
      MONGODB_DATABASE: "${MONGODB_DATABASE}"                          # MongoDB 数据库名
      JWT_SECRET: "${JWT_SECRET}"                                      # 用户 JWT 签名密钥
      OPENJWT_SECRET: "${OPENJWT_SECRET}"                              # 开放 gRPC JWT 签名密钥
      PARTNER_A_ACCESS_KEY_ID: "${PARTNER_A_ACCESS_KEY_ID}"            # 三方合作方访问凭证
      PARTNER_A_SECRET_KEY: "${PARTNER_A_SECRET_KEY}"                  # 三方合作方共享密钥
      OSS_ACCESS_KEY_ID: "${OSS_ACCESS_KEY_ID}"                        # OSS 访问凭证
      OSS_SECRET_ACCESS_KEY: "${OSS_SECRET_ACCESS_KEY}"                # OSS 访问密钥
      ELASTICSEARCH_USERNAME: "${ELASTICSEARCH_USERNAME:-elastic}"
      ELASTICSEARCH_PASSWORD: "${ELASTICSEARCH_PASSWORD}"
      CANAL_SERVER_USERNAME: "${CANAL_SERVER_USERNAME:-}"
      CANAL_SERVER_PASSWORD: "${CANAL_SERVER_PASSWORD:-}"
    image: ccr.ccs.tencentyun.com/lf-blog/blog-web:v1.0.0
    container_name: blog-consumer
    restart: always
    command: ["kafka-consume"] # 启动容器内的命令
    volumes:
      - ./config/config.docker.yaml:/app/config/config.yaml:ro  # 用 docker 专用配置覆盖容器内默认的 config.yaml
    depends_on:   # 依赖的其他服务
      mysql:
        condition: service_healthy    # 等待 MySQL 服务健康
      redis:
        condition: service_healthy    # 等待 Redis 服务健康
      mongodb:
        condition: service_healthy    # 等待 MongoDB 服务健康
      kafka:
        condition: service_healthy    # 等待 Kafka 服务健康
    networks:
      - blog-net

  # 文章搜索增量同步进程，保持单副本运行
  search-sync:
    image: ccr.ccs.tencentyun.com/lf-blog/blog-web:v1.0.0
    container_name: blog-search-sync
    restart: always
    env_file:
      - .env
    environment:
      ELASTICSEARCH_USERNAME: "${ELASTICSEARCH_USERNAME:-elastic}"
      ELASTICSEARCH_PASSWORD: "${ELASTICSEARCH_PASSWORD}"
      CANAL_SERVER_USERNAME: "${CANAL_SERVER_USERNAME:-}"
      CANAL_SERVER_PASSWORD: "${CANAL_SERVER_PASSWORD:-}"
    command: ["search-sync"]
    volumes:
      - ./config/config.docker.yaml:/app/config/config.yaml:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
      canal:
        condition: service_healthy
    networks:
      - blog-net

# 数据卷定义，把容器内部的数据目录，挂载到 Docker 管理的外部存储空间，这样数据就和容器本身分离了
volumes:
  mysql_data:   # 创建一个名为 "mysql_data" 的数据卷
  redis_data:
  mongo_data:
  kafka_data:
  es_data:
  canal_conf:
  canal_logs:

# 网络定义
networks:
  blog-net:
    driver: bridge  # 桥接网络，容器间通信
