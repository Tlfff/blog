name: blog

# 服务定义
services:
  # MySQL 服务定义
  mysql:
    image: mysql:8.0 
    container_name: blog-mysql # 容器名字
    restart: always # 重启策略，容器异常退出时总是自动重启
    environment:
      MYSQL_ROOT_PASSWORD: "Tlf0614"            # root 超级管理员密码
      MYSQL_DATABASE: "blog"                    # 容器启动时自动创建的数据库名
      MYSQL_USER: "bloguser"                    # 额外创建的应用专用用户
      MYSQL_PASSWORD: "20040614"                # 应用用户的密码
      TZ: Asia/Shanghai                         # 容器时区设置，影响时间函数
    ports:
      - "3306:3306" # 映射端口，外部访问端口：容器端口
    volumes:
      - mysql_data:/var/lib/mysql # 映射数据卷，将容器内的数据持久化到主机
      - ./scripts/mysql:/docker-entrypoint-initdb.d # 映射初始化脚本，将主机上的脚本挂载到容器内
    command: 
      - "--character-set-server=utf8mb4"  # 设置字符集为 utf8mb4
      - "--collation-server=utf8mb4_unicode_ci"  # 设置排序规则为 utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"] # 健康检查
      interval: 10s # 检查间隔，10 秒
      timeout: 10s   # 检查超时时间，10 秒
      retries: 10      # 最大重试次数，10 次
      start_period: 60s # 首次初始化要执行建表 SQL，给足宽限期
    networks:
      - blog-net # 加入自定义网络 blog-net
  # Redis 服务定义
  redis:  
    image: redis:7-alpine 
    container_name: blog-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:  
      - redis_data:/data  # 映射数据卷，将容器内的数据持久化到主机
    command: redis-server --appendonly yes --aof-use-rdb-preamble yes # 开启混合持久化
    healthcheck:
      test: ["CMD", "redis-cli", "ping"] # 检查 Redis 服务是否正常
      interval: 10s # 检查间隔，10 秒
      timeout: 10s   # 检查超时时间，10 秒
      retries: 5       # 最大重试次数，5 次
      start_period: 30s # 容器启动后等待 130 秒，确保redis初始化完成
    networks:
      - blog-net
  # MongoDB 服务定义
  mongodb:
    image: mongo:7
    container_name: blog-mongodb
    restart: always
    environment:  # 环境变量配置
      MONGO_INITDB_ROOT_USERNAME: "bloguser" # 初始化 MongoDB 的 root 用户名
      MONGO_INITDB_ROOT_PASSWORD: "20040614" # 初始化 MongoDB 的 root 密码
      MONGO_INITDB_DATABASE: "blog" # 初始化 MongoDB 的数据库名
      TZ: Asia/Shanghai # 容器时区设置，影响时间函数
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db # 映射数据卷，将容器内的数据持久化到主机
      - ./scripts/mongodb:/docker-entrypoint-initdb.d # 映射初始化脚本，将主机上的脚本挂载到容器内
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"] # 检查 MongoDB 服务是否正常
      interval: 10s # 检查间隔，10 秒
      timeout: 10s   # 检查超时时间，10 秒
      retries: 5       # 最大重试次数，5 次
      start_period: 30s # 容器启动后等待 30 秒，确保mongodb初始化完成
    networks:
      - blog-net
  # Kafka 服务定义
  kafka:
    image: apache/kafka:4.0.0
    container_name: blog-kafka
    restart: always
    environment:
      # KRaft 模式：节点既是 broker 又是 controller
      KAFKA_NODE_ID: "1"  # 节点 ID，用于 KRaft 协议
      KAFKA_PROCESS_ROLES: "broker,controller"  # 节点角色，broker 或 controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"  # 控制器选举投票者列表
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"   # controller 监听器名称
      KAFKA_LISTENERS: "PLAINTEXT://:9092,EXTERNAL://:29092,CONTROLLER://:9093"   # 监听器配置，容器间通信 / 宿主机访问 / controller 内部选举
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092"   # 对外公布的地址，容器间通信 / 宿主机访问
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"  # 监听器安全协议映射，容器间通信 / 宿主机访问 / controller 内部选举，PLAINTEXT 明文
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"  # 自动创建主题，当消费者订阅不存在的主题时，会自动创建该主题
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"  # 消费者进度记录保存几份副本
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"  # 事务状态日志保存几份副本
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"  # 事务状态日志最小 ISR，默认值为 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"  # 消费者启动时，等待多久开始分配任务
      TZ: Asia/Shanghai
    ports:
      - "9092:9092"      # 容器间内部通信
      - "29092:29092"    # 宿主机外部访问（Kafka 工具连接用）
    volumes:
      - kafka_data:/bitnami/kafka   # 映射数据卷，将容器内的数据持久化到主机
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092 || exit 1"]
      interval: 10s # 检查间隔，10 秒
      timeout: 10s   # 检查超时时间，10 秒
      retries: 5       # 最大重试次数，5 次
      start_period: 30s    # 容器启动后等待 30 秒，确保Kafka初始化完成
    networks:
      - blog-net


  # Elasticsearch搜索引擎
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.20       # ES镜像版本，8.x稳定分支
    container_name: blog-es                                             # ES容器名称
    restart: always                                                     # 异常退出自动重启
    environment:
      - discovery.type=single-node                                      # 单节点模式，不需要搭建集群
      - xpack.security.enabled=false                                    # 关闭安全认证，开发环境http明文访问
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"                                # JVM堆内存，最大最小数值保持一致
      - TZ=Asia/Shanghai                                                # 设置容器时区
    ulimits:
      memlock:
        soft: -1                                                        # 内存锁定软限制
        hard: -1                                                        # 内存锁定硬限制，ES运行必需
    ports:
      - "9200:9200"                                                     # ES REST接口端口，业务调用
      - "9300:9300"                                                     # ES集群内部通信端口
    volumes:
      - es_data:/usr/share/elasticsearch/data                           # ES索引数据持久化卷
    healthcheck:
      test: ["CMD-SHELL","curl -s http://127.0.0.1:9200/_cluster/health | grep -q 'status'"] # ES健康检测
      interval: 10s
      timeout: 10s
      retries: 8
      start_period: 60s                                                 # ES初始化等待宽限期
    networks:
      - blog-net

  # Kibana可视化控制台
  kibana:
    image: docker.elastic.co/kibana/kibana:8.19.20                     # Kibana版本，必须与ES版本完全一致
    container_name: blog-kibana                                         # Kibana容器名
    restart: always
    depends_on:
      elasticsearch:
        condition: service_healthy                                      # ES健康之后才启动Kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200                   # 通过内网服务名访问ES
      - TZ=Asia/Shanghai
    ports:
      - "5601:5601"                                                     # Kibana网页控制台端口
    healthcheck:
      test: ["CMD-SHELL","curl -s http://127.0.0.1:5601/api/status | grep -q 'success'"]
      interval: 10s
      timeout: 10s
      retries: 8
      start_period: 90s                                                 # Kibana启动较慢，预留更长时间
    networks:
      - blog-net

  
  # 后端服务
  blog-server:
    image: blog-server:latest
    container_name: blog-server
    restart: always
    build:
      context: .    # 构建上下文，当前目录
      dockerfile: Dockerfile # 构建文件路径
    command: ["server"] # 启动容器内的命令
    ports:
      - "8080:8080"
    volumes:
      - ./config/config.docker.yaml:/app/config/config.yaml:ro  # 用 docker 专用配置覆盖容器内默认的 config.yaml
      - ./internal/platform/ip/resource:/app/internal/platform/ip/resource:ro  # Platform IP 地理位置数据库（只读挂载，方便更新）
    depends_on:   # 依赖的其他服务
      mysql:
        condition: service_healthy    # 等待 MySQL 服务健康
      redis:
        condition: service_healthy    # 等待 Redis 服务健康
      mongodb:
        condition: service_healthy    # 等待 MongoDB 服务健康
      kafka:
        condition: service_healthy    # 等待 Kafka 服务健康
    networks:
      - blog-net

  # 对外服务（gRPC，二方/三方）
  blog-grpc:
    image: blog-server:latest
    container_name: blog-grpc
    restart: always
    command: ["grpc"]
    ports:
      - "9100:9100"
    volumes:
      - ./config/config.docker.yaml:/app/config/config.yaml:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - blog-net

  # Kafka 消费者
  blog-consumer:
    image: blog-server:latest
    container_name: blog-consumer
    restart: always
    command: ["kafka-consume"]
    volumes:
      - ./config/config.docker.yaml:/app/config/config.yaml:ro  # 用 docker 专用配置覆盖容器内默认的 config.yaml
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - blog-net
# 数据卷定义，把容器内部的数据目录，挂载到 Docker 管理的外部存储空间，这样数据就和容器本身分离了
volumes:
  mysql_data:   # 创建一个名为 "mysql_data" 的数据卷
  redis_data:
  mongo_data:
  kafka_data:
  es_data:
  kibana_data:

# 网络定义
networks:
  blog-net:
    driver: bridge  # 桥接网络，容器间通信