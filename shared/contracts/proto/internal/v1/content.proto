syntax = "proto3";

package blog.internal.v1;

option go_package = "blog/shared/contracts/gen/internalv1;internalv1";

import "internal/v1/common.proto";

// ContentService 是 Content Service 对统一入口和其他服务暴露的内部 gRPC 接口。
service ContentService {
  rpc CreateArticle(CreateArticleRequest) returns (Empty);
  rpc UpdateArticle(UpdateArticleRequest) returns (Empty);
  rpc DeleteArticle(ArticleUserRequest) returns (Empty);
  rpc ClearArticle(ArticleUserRequest) returns (Empty);
  rpc PublishArticle(ArticleUserRequest) returns (Empty);
  rpc RecoverArticle(ArticleUserRequest) returns (Empty);
  rpc GetPublishedArticle(ArticleUserRequest) returns (ArticleDetail);
  rpc GetArticle(ArticleUserRequest) returns (ArticleDetail);
  rpc GetPublishedList(ListArticlesRequest) returns (ArticleList);
  rpc GetAdminList(AdminListRequest) returns (AdminList);
  rpc GetAvailableList(ListArticlesRequest) returns (AvailableList);
  rpc GetImageUploadURL(ImageUploadRequest) returns (UploadURLResponse);
  rpc GetArticleInfo(ArticleIDRequest) returns (ArticleInfo);
}

message ArticleIDRequest {
  uint64 article_id = 1;
}

message ArticleInfo {
  uint64 id = 1;
  uint64 author_id = 2;
  string title = 3;
}

message CreateArticleRequest {
  uint64 author_id = 1;
  string title = 2;
  string content = 3;
  repeated string tags = 4;
  int32 status = 5;
}

message UpdateArticleRequest {
  uint64 article_id = 1;
  uint64 author_id = 2;
  string title = 3;
  string content = 4;
  repeated string tags = 5;
  int32 status = 6;
}

message ArticleDetail {
  uint64 id = 1;
  string title = 2;
  string content = 3;
  repeated string tags = 4;
  int32 status = 5;
  string author_nick = 6;
  string author_avatar = 7;
  string ip = 8;
  int64 created_time = 9;
  int64 updated_time = 10;
  bool is_liked = 11;
  uint64 like_count = 12;
}

message ListArticlesRequest {
  uint64 page = 1;
  uint64 page_size = 2;
  uint64 last_id = 3;
  bool is_desc = 4;
}

message ArticleListItem {
  uint64 id = 1;
  string title = 2;
  string summary = 3;
  uint64 author_id = 4;
  int64 updated_time = 5;
  uint32 view_count = 6;
  uint32 like_count = 7;
  uint32 comment_count = 8;
}

message ArticleList {
  repeated ArticleListItem items = 1;
  uint64 last_id = 2;
  uint64 total = 3;
  uint64 page = 4;
  uint64 page_size = 5;
}

message AdminListRequest {
  uint64 page = 1;
  uint64 page_size = 2;
  uint64 last_id = 3;
  bool is_desc = 4;
  int32 status = 5;
}

message AdminListItem {
  uint64 id = 1;
  string title = 2;
  repeated string tags = 3;
  int32 status = 4;
  int64 created_time = 5;
  int64 updated_time = 6;
}

message AdminList {
  repeated AdminListItem items = 1;
  uint64 last_id = 2;
  uint64 total = 3;
  uint64 page = 4;
  uint64 page_size = 5;
}

message AvailableItem {
  uint64 id = 1;
  string title = 2;
  repeated string tags = 3;
  int64 created_time = 4;
  int64 updated_time = 5;
}

message AvailableList {
  repeated AvailableItem items = 1;
  uint64 total = 2;
  uint64 page = 3;
  uint64 page_size = 4;
}

message ImageUploadRequest {
  string file_ext = 1;
}
