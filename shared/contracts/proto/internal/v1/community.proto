syntax = "proto3";

package blog.internal.v1;

option go_package = "blog/shared/contracts/gen/internalv1;internalv1";

import "internal/v1/common.proto";

// CommunityService 是 Community Service 对统一入口和其他服务暴露的内部 gRPC 接口。
service CommunityService {
  rpc CreateComment(CreateCommentRequest) returns (CreateCommentResponse);
  rpc ListRootComments(ListRootCommentsRequest) returns (RootCommentList);
  rpc ListReplies(ListRepliesRequest) returns (ReplyList);
  rpc DeleteComment(DeleteCommentRequest) returns (Empty);
  rpc GetCommentStats(CommentIDRequest) returns (CommentStats);
  rpc ArticleLike(ArticleUserRequest) returns (Empty);
  rpc ArticleCancelLike(ArticleUserRequest) returns (Empty);
  rpc CommentLike(CommentUserRequest) returns (Empty);
  rpc CommentCancelLike(CommentUserRequest) returns (Empty);
  rpc IsUserLikedArticle(ArticleUserRequest) returns (LikeState);
  rpc GetHotRank(HotRankRequest) returns (HotRank);
  rpc RebuildHotRank(Empty) returns (Empty);
  rpc SendViewHistory(ViewHistoryRequest) returns (Empty);
  rpc GetNotifications(NotificationListRequest) returns (NotificationList);
  rpc GetUnreadCount(UserIDRequest) returns (UnreadCount);
  rpc ClearUnread(UserIDRequest) returns (Empty);
}

message CreateCommentRequest {
  uint64 article_id = 1;
  uint64 root_id = 2;
  uint64 user_id = 3;
  uint64 reply_to_user_id = 4;
  string content = 5;
  string ip = 6;
}

message CreateCommentResponse {
  uint64 id = 1;
  int64 created_time = 2;
}

message CommentUserInfo {
  uint64 user_id = 1;
  string username = 2;
  string avatar = 3;
}

message RootCommentItem {
  uint64 id = 1;
  uint64 article_id = 2;
  CommentUserInfo user = 3;
  string content = 4;
  uint32 reply_count = 5;
  string ip = 6;
  int64 created_time = 7;
  int32 status = 8;
  uint64 like_count = 9;
}

message RootCommentList {
  repeated RootCommentItem items = 1;
  int64 total = 2;
  uint64 last_id = 3;
  uint64 page = 4;
  uint64 page_size = 5;
}

message ListRootCommentsRequest {
  uint64 article_id = 1;
  uint64 last_id = 2;
  uint64 page = 3;
  uint64 page_size = 4;
  bool is_desc = 5;
  uint64 author_id = 6;
}

message ReplyCommentItem {
  uint64 id = 1;
  uint64 article_id = 2;
  uint64 root_id = 3;
  CommentUserInfo user = 4;
  CommentUserInfo reply_to_user = 5;
  string content = 6;
  int64 created_time = 7;
  int32 status = 8;
  string ip = 9;
  uint64 like_count = 10;
}

message ReplyList {
  repeated ReplyCommentItem items = 1;
  int64 total = 2;
  uint64 last_id = 3;
  uint64 page = 4;
  uint64 page_size = 5;
}

message ListRepliesRequest {
  uint64 root_id = 1;
  uint64 last_id = 2;
  uint64 page = 3;
  uint64 page_size = 4;
}

message DeleteCommentRequest {
  uint64 comment_id = 1;
  uint64 user_id = 2;
  bool is_admin = 3;
}

message CommentIDRequest {
  uint64 comment_id = 1;
}

message CommentStats {
  uint64 comment_id = 1;
  uint64 hot_value = 2;
  uint64 like_count = 3;
}

message CommentUserRequest {
  uint64 comment_id = 1;
  uint64 user_id = 2;
}

message LikeState {
  bool liked = 1;
}

message HotRankRequest {
  int32 limit = 1;
}

message HotRankItem {
  uint64 article_id = 1;
  string title = 2;
  double hot = 3;
  uint32 view_count = 4;
  uint32 comment_count = 5;
  uint32 like_count = 6;
}

message HotRank {
  repeated HotRankItem items = 1;
}

message ViewHistoryRequest {
  uint64 article_id = 1;
  uint64 user_id = 2;
}

message NotificationListRequest {
  uint64 user_id = 1;
  int64 page = 2;
  int64 page_size = 3;
}

message NotificationItem {
  string id = 1;
  int32 type = 2;
  bool is_read = 3;
  int64 created_time = 4;
  uint64 sender_id = 5;
  string sender_nickname = 6;
  string sender_avatar = 7;
  string action_text = 8;
  uint64 article_id = 9;
  string title = 10;
}

message NotificationList {
  repeated NotificationItem items = 1;
  int64 page = 2;
  int64 page_size = 3;
}

message UnreadCount {
  int64 count = 1;
}
